version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: financeiro_db
    environment:
      POSTGRES_USER: financeiro_user
      POSTGRES_PASSWORD: financeiro_pass
      POSTGRES_DB: financeiro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeiro_backend
    environment:
      DATABASE_URL: postgresql://financeiro_user:financeiro_pass@db:5432/financeiro_db
      SECRET_KEY: sua-chave-secreta-desenvolvimento
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:18-alpine
    container_name: financeiro_frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres_data:
